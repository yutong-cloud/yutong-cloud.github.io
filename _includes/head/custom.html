<link rel="icon" type="image/svg+xml" href="{{ '/images/placeholders/favicon.svg' | relative_url }}">
<meta name="theme-color" content="#ffffff">
{% if page.home_entrance %}
<link rel="stylesheet" href="{{ '/assets/css/home-entrance.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<script>
  (function () {
    try {
      if (!location.hash && sessionStorage.getItem('yutong-entrance-entered') !== '1' && window.HTMLDialogElement) {
        document.documentElement.classList.add('entrance-pending');
        window.setTimeout(function () { document.documentElement.classList.remove('entrance-pending'); }, 2000);
      }
    } catch (_) {}
  })();
</script>
<script src="{{ '/assets/js/home-entrance.js' | relative_url }}" defer></script>
{% endif %}
<link rel="stylesheet" href="{{ '/assets/css/language-switch.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<script src="{{ '/assets/js/language-switch.js' | relative_url }}" defer></script>
{% if page.homepage_palette == 'classic-blue' %}
<link rel="alternate" hreflang="zh-CN" href="{{ '/zh/' | absolute_url }}">
<link rel="alternate" hreflang="en" href="{{ '/' | absolute_url }}">
<link rel="alternate" hreflang="x-default" href="{{ '/' | absolute_url }}">
{% endif %}
<link rel="stylesheet" href="{{ '/assets/css/academicons.css' | relative_url }}?v={{ site.time | date: '%s' }}">
{% if page.homepage_palette == 'classic-blue' %}
<link rel="stylesheet" href="{{ '/assets/css/home-sections.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<link rel="stylesheet" href="{{ '/assets/css/classic-home.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<link rel="stylesheet" href="{{ '/assets/css/books.css' | relative_url }}?v={{ site.time | date: '%s' }}">
{% if site.data.music.size > 0 %}<link rel="stylesheet" href="{{ '/assets/css/music-player.css' | relative_url }}?v={{ site.time | date: '%s' }}">{% endif %}
{% endif %}
{% if page.math %}
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
{% endif %}
