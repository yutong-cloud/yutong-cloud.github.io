name: Publish WowPage

on:
  push:
    branches: [gh-pages, wowpage-template-20261104]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wowpage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build original WowPage template
        env:
          JEKYLL_ENV: production
          PAGES_REPO_NWO: ${{ github.repository }}
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bundle exec jekyll build --baseurl '' --trace
      - name: Check links and assets
        run: node scripts/check-site.mjs
      - name: Save preview for review
        if: github.ref != 'refs/heads/gh-pages'
        uses: actions/upload-artifact@v4
        with:
          name: wowpage-preview
          path: |
            _site/
            !_site/assets/*.pdf
            !_site/assets/fonts/
            !_site/assets/webfonts/
            !_site/images/
          include-hidden-files: true
          retention-days: 7
      - name: Prepare GitHub Pages
        if: github.ref == 'refs/heads/gh-pages'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy:
    if: github.ref == 'refs/heads/gh-pages'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
